# Deploy the website to GitHub Pages.
#
# The site is assembled from two branches:
#   main         site content (home, about, ...) with normal git history
#   dev-results  only dev/ (latest test results); force-pushed by the Flash-MX
#                container-run workflow, so it has no history
#
# This workflow lives on main, so it runs when main is pushed or when it is
# dispatched on main. Pushing dev-results alone cannot start it; the Flash-MX
# workflow dispatches it after each results push.
# dev/ is never tracked on main. Pages must be set to deploy from "GitHub Actions"
# (Settings -> Pages -> Source).
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # wait step lists run artifacts

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Add latest test results (dev/)
        run: |
          if git clone -q --depth 1 --branch dev-results --single-branch \
               "${{ github.server_url }}/${{ github.repository }}" devres; then
            cp -a devres/dev site/dev
          else
            echo "No dev-results branch yet; deploying without dev/."
          fi
          rm -rf site/.git site/.github

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # deploy-pages reads the eventually-consistent results service; right
      # after upload it can see 0 artifacts and fail. Wait until listable.
      - name: Wait for artifact visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '.artifacts[].name' | grep -qx github-pages && { sleep 5; exit 0; }
            sleep 2
          done
          echo "::error::github-pages artifact not visible after 120s" >&2
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
